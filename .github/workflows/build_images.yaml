name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push PHP Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./php
          push: true
          tags: leidruid/frankenphp-bitrix-php:${{ steps.get_tag.outputs.TAG }},leidruid/frankenphp-bitrix-php:latest
      - name: Build and push ProFTPd Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./proftpd
          push: true
          tags: leidruid/frankenphp-bitrix-sftp:${{ steps.get_tag.outputs.TAG }},leidruid/frankenphp-bitrix-sftp:latest